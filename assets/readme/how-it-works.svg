<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">How CC Switch works</title>
  <desc id="desc">One SQLite database is the single source of truth; switching atomically writes live config files for each AI tool, and edits to live files sync back.</desc>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C0F"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
    <marker id="arrow-fwd" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 z" fill="#00D68F"/>
    </marker>
    <marker id="arrow-back" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M0,0 L18,9 L0,18 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="1200" height="380" rx="26" fill="url(#bg2)"/>

  <g id="database-card" transform="translate(56 55)">
    <rect x="0" y="0" width="330" height="270" rx="16" fill="#14171C" stroke="#2A2F38"/>
    <text x="24" y="46" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="24" font-weight="700" fill="#F7F8FA">CC Switch</text>
    <text x="24" y="80" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace' font-size="17" fill="#00D68F">~/.cc-switch/cc-switch.db</text>
    <text x="24" y="110" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="18" fill="#9CA3AF">SQLite · one source of truth</text>
    <line x1="24" y1="132" x2="306" y2="132" stroke="#2A2F38" stroke-width="1"/>
    <g id="data-chips" transform="translate(24 152)">
      <rect x="0" y="0" width="98" height="30" rx="15" fill="#1A1D23"/>
      <text x="49" y="20" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace' font-size="15" fill="#9CA3AF">providers</text>
      <rect x="106" y="0" width="56" height="30" rx="15" fill="#1A1D23"/>
      <text x="134" y="20" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace' font-size="15" fill="#9CA3AF">MCP</text>
      <rect x="170" y="0" width="88" height="30" rx="15" fill="#1A1D23"/>
      <text x="214" y="20" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace' font-size="15" fill="#9CA3AF">prompts</text>
      <rect x="0" y="40" width="72" height="30" rx="15" fill="#1A1D23"/>
      <text x="36" y="60" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace' font-size="15" fill="#9CA3AF">skills</text>
      <rect x="80" y="40" width="66" height="30" rx="15" fill="#1A1D23"/>
      <text x="113" y="60" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace' font-size="15" fill="#9CA3AF">usage</text>
    </g>
    <text x="24" y="250" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="17" fill="#9CA3AF">switch via UI · tray · deep link</text>
  </g>

  <g id="sync-arrows">
    <line x1="398" y1="150" x2="800" y2="150" stroke="#00D68F" stroke-width="2.5" marker-end="url(#arrow-fwd)"/>
    <text x="600" y="122" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="21" font-weight="600" fill="#F7F8FA">atomic write on switch</text>
    <text x="600" y="176" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace' font-size="17" fill="#9CA3AF">temp file + rename</text>

    <line x1="800" y1="240" x2="398" y2="240" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-back)"/>
    <text x="600" y="270" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="21" font-weight="600" fill="#C9CED6">backfill on live edits</text>
    <text x="600" y="296" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace' font-size="17" fill="#9CA3AF">edits sync back to the database</text>
  </g>

  <g id="live-configs-card" transform="translate(814 55)">
    <rect x="0" y="0" width="330" height="270" rx="16" fill="#14171C" stroke="#2A2F38"/>
    <text x="24" y="42" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="22" font-weight="700" fill="#F7F8FA">Live tool configs</text>
    <g id="config-rows" transform="translate(20 62)">
      <rect x="0" y="0" width="290" height="42" rx="10" fill="#12151A" stroke="#2A2F38"/>
      <text x="16" y="27" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="19" fill="#F7F8FA">Claude Code</text>
      <text x="276" y="27" text-anchor="end" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace' font-size="16" fill="#9CA3AF">settings.json</text>
      <rect x="0" y="50" width="290" height="42" rx="10" fill="#12151A" stroke="#2A2F38"/>
      <text x="16" y="77" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="19" fill="#F7F8FA">Codex</text>
      <text x="276" y="77" text-anchor="end" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace' font-size="16" fill="#9CA3AF">config.toml</text>
      <rect x="0" y="100" width="290" height="42" rx="10" fill="#12151A" stroke="#2A2F38"/>
      <text x="16" y="127" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="19" fill="#F7F8FA">Gemini CLI</text>
      <text x="276" y="127" text-anchor="end" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace' font-size="16" fill="#9CA3AF">.env</text>
      <rect x="0" y="150" width="290" height="42" rx="10" fill="none" stroke="#2A2F38" stroke-dasharray="6 5"/>
      <text x="145" y="177" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="18" fill="#9CA3AF">+ 5 more tools</text>
    </g>
  </g>
</svg>
