<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">CC Switch</title>
  <desc id="desc">CC Switch title with a simplified app window showing provider rows and one active provider toggled on.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C0F"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>

  <g id="title-block" transform="translate(64 50)">
    <text x="0" y="64" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="72" font-weight="800" fill="#F7F8FA">CC Switch</text>
    <text x="0" y="118" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="25" fill="#9CA3AF">Switch API providers, MCP, prompts &amp; skills</text>
    <text x="0" y="152" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="25" fill="#9CA3AF">across eight AI coding tools — in one click.</text>
    <g id="meta-chips" transform="translate(0 184)">
      <rect x="0" y="0" width="96" height="30" rx="15" fill="#1A1D23" stroke="#2A2F38"/>
      <text x="48" y="20" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Monaco, monospace' font-size="15" fill="#00D68F">Tauri 2</text>
      <rect x="108" y="0" width="212" height="30" rx="15" fill="#1A1D23" stroke="#2A2F38"/>
      <text x="214" y="20" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="15" fill="#F7F8FA">Windows · macOS · Linux</text>
      <rect x="332" y="0" width="116" height="30" rx="15" fill="#1A1D23" stroke="#2A2F38"/>
      <text x="390" y="20" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="15" fill="#F7F8FA">50+ presets</text>
    </g>
  </g>

  <g id="switcher-proof" transform="translate(700 30)">
    <rect x="0" y="0" width="436" height="260" rx="16" fill="#14171C" stroke="#2A2F38"/>
    <g id="tool-tabs" transform="translate(20 18)">
      <rect x="0" y="0" width="88" height="32" rx="16" fill="#1A1D23" stroke="#00D68F"/>
      <text x="44" y="21" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="16" font-weight="600" fill="#F7F8FA">Claude</text>
      <rect x="98" y="0" width="82" height="32" rx="16" fill="none" stroke="#2A2F38"/>
      <text x="139" y="21" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="16" fill="#9CA3AF">Codex</text>
      <rect x="190" y="0" width="90" height="32" rx="16" fill="none" stroke="#2A2F38"/>
      <text x="235" y="21" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="16" fill="#9CA3AF">Gemini</text>
      <rect x="290" y="0" width="48" height="32" rx="16" fill="none" stroke="#2A2F38"/>
      <text x="314" y="21" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="16" fill="#9CA3AF">+5</text>
    </g>
    <g id="provider-rows" transform="translate(20 66)">
      <g id="row-inactive-1">
        <rect x="0" y="0" width="396" height="52" rx="12" fill="#12151A" stroke="#2A2F38"/>
        <circle cx="24" cy="26" r="5" fill="#4B5563"/>
        <text x="42" y="32" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="18" fill="#C9CED6">DeepSeek</text>
        <rect x="346" y="17" width="34" height="18" rx="9" fill="#2A2F38"/>
        <circle cx="355" cy="26" r="7" fill="#6B7280"/>
      </g>
      <g id="row-active" transform="translate(0 62)">
        <rect x="0" y="0" width="396" height="52" rx="12" fill="#0F1B16" stroke="#00D68F" stroke-width="1.5"/>
        <circle cx="24" cy="26" r="5" fill="#00D68F"/>
        <text x="42" y="32" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="18" font-weight="600" fill="#F7F8FA">GLM</text>
        <rect x="96" y="14" width="128" height="24" rx="12" fill="#0E2A1F" stroke="#00D68F"/>
        <text x="160" y="31" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="15" fill="#00D68F">Currently Using</text>
        <rect x="346" y="17" width="34" height="18" rx="9" fill="#00D68F"/>
        <circle cx="371" cy="26" r="7" fill="#0B0C0F"/>
      </g>
      <g id="row-inactive-2" transform="translate(0 124)">
        <rect x="0" y="0" width="396" height="52" rx="12" fill="#12151A" stroke="#2A2F38"/>
        <circle cx="24" cy="26" r="5" fill="#4B5563"/>
        <text x="42" y="32" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif' font-size="18" fill="#C9CED6">Kimi</text>
        <rect x="346" y="17" width="34" height="18" rx="9" fill="#2A2F38"/>
        <circle cx="355" cy="26" r="7" fill="#6B7280"/>
      </g>
    </g>
  </g>
</svg>
